name: Build Tableau Datasource

on:
  workflow_dispatch:
    inputs:
      include_archive:
        description: Include archive/runs lineage
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build-tableau-datasource:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Export Tableau dataset
        shell: bash
        run: |
          args=(
            --repo-root .
            --output-dir artifacts/tableau
          )
          if [[ "${{ inputs.include_archive }}" != "true" ]]; then
            args+=(--no-archive)
          fi
          python integrations/tableau/export_dataset.py "${args[@]}"

      - name: Validate export boundaries
        run: python integrations/tableau/validate_export.py artifacts/tableau

      - name: Package export
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path("artifacts/tableau")
          shutil.make_archive("artifacts/structura-reditus-tableau-datasource", "zip", root)
          PY

      - name: Upload datasource artifact
        uses: actions/upload-artifact@v4
        with:
          name: structura-reditus-tableau-datasource
          path: |
            artifacts/tableau/
            artifacts/structura-reditus-tableau-datasource.zip
          if-no-files-found: error
          retention-days: 30
